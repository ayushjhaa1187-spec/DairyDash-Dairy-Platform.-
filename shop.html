<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Fresh Dairy Products | DairyDash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2ECC71',
                        secondary: '#3498DB',
                        accent: '#F1C40F',
                        danger: '#E74C3C'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="flex flex-col min-h-screen bg-gray-50">

    <!-- HEADER -->
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <a href="index.html" class="flex items-center gap-2 group">
                    <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white text-2xl font-bold group-hover:scale-110 transition shadow-sm">🥛</div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800 tracking-tight">DairyDash</h1>
                        <p class="text-xs text-gray-500 font-medium -mt-1">Fresh in 10 mins</p>
                    </div>
                </a>

                <div class="flex items-center gap-4">
                    <a href="cart.html" class="flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-lg font-bold shadow-sm hover:shadow-md transition transform hover:-translate-y-0.5">
                        <span class="text-xl">🛒</span>
                        <span class="cart-count-display text-sm">Cart (0)</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="flex flex-col lg:flex-row gap-8">

            <!-- SIDEBAR FILTERS (Desktop) / TOP SCROLL (Mobile) -->
            <aside class="w-full lg:w-64 flex-shrink-0">
                <div class="bg-white rounded-xl shadow-sm p-6 sticky top-24">
                    <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Categories</h2>

                    <!-- Desktop Vertical List -->
                    <div class="hidden lg:flex flex-col gap-2">
                        <button onclick="filterProducts('all')" class="filter-btn active text-left px-4 py-3 rounded-lg font-medium hover:bg-green-50 hover:text-primary transition flex items-center gap-3">
                            <span>🏠</span> All Products
                        </button>
                        <button onclick="filterProducts('milk')" class="filter-btn text-left px-4 py-3 rounded-lg font-medium hover:bg-green-50 hover:text-primary transition flex items-center gap-3">
                            <span>🥛</span> Milk
                        </button>
                        <button onclick="filterProducts('paneer')" class="filter-btn text-left px-4 py-3 rounded-lg font-medium hover:bg-green-50 hover:text-primary transition flex items-center gap-3">
                            <span>🧀</span> Paneer & Cheese
                        </button>
                        <button onclick="filterProducts('curd')" class="filter-btn text-left px-4 py-3 rounded-lg font-medium hover:bg-green-50 hover:text-primary transition flex items-center gap-3">
                            <span>🍨</span> Curd & Yogurt
                        </button>
                        <button onclick="filterProducts('butter')" class="filter-btn text-left px-4 py-3 rounded-lg font-medium hover:bg-green-50 hover:text-primary transition flex items-center gap-3">
                            <span>🧈</span> Butter & Ghee
                        </button>
                        <button onclick="filterProducts('beverages')" class="filter-btn text-left px-4 py-3 rounded-lg font-medium hover:bg-green-50 hover:text-primary transition flex items-center gap-3">
                            <span>🥤</span> Beverages
                        </button>
                    </div>

                    <!-- Mobile Horizontal Scroll -->
                    <div class="flex lg:hidden overflow-x-auto gap-3 pb-2 scrollbar-hide">
                         <button onclick="filterProducts('all')" class="filter-btn active whitespace-nowrap px-4 py-2 bg-white border border-gray-200 rounded-full font-medium text-sm">All</button>
                         <button onclick="filterProducts('milk')" class="filter-btn whitespace-nowrap px-4 py-2 bg-white border border-gray-200 rounded-full font-medium text-sm">Milk</button>
                         <button onclick="filterProducts('paneer')" class="filter-btn whitespace-nowrap px-4 py-2 bg-white border border-gray-200 rounded-full font-medium text-sm">Paneer</button>
                         <button onclick="filterProducts('curd')" class="filter-btn whitespace-nowrap px-4 py-2 bg-white border border-gray-200 rounded-full font-medium text-sm">Curd</button>
                         <button onclick="filterProducts('butter')" class="filter-btn whitespace-nowrap px-4 py-2 bg-white border border-gray-200 rounded-full font-medium text-sm">Butter</button>
                    </div>
                </div>
            </aside>

            <!-- PRODUCTS GRID -->
            <div class="flex-1">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800" id="category-title">All Products</h2>
                    <select class="bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
                        <option>Sort by: Popularity</option>
                        <option>Price: Low to High</option>
                        <option>Price: High to Low</option>
                    </select>
                </div>

                <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 gap-6">
                    <!-- Products populated by JS -->
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <style>
        .filter-btn.active {
            background-color: #E8F8F5; /* green-50 */
            color: var(--primary);
            border-color: var(--primary);
            font-weight: 700;
        }
        /* Hide scrollbar for mobile filter */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body>
</html>
