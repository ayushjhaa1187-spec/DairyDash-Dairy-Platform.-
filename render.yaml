services:
  - type: web
    name: dairydash-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  - type: static
    name: dairydash-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: echo "No build command for static site"
    staticPublishPath: .
